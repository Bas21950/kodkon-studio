name: Build and publish Windows update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate updater with Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = Join-Path $PWD 'scripts\apply-update.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'Updater must have a UTF-8 BOM so Windows PowerShell 5.1 reads Thai text correctly'
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | ForEach-Object { $_.ToString() } | Out-String) }

          $ast = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          $statusFunction = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Write-UpdateStatus' }, $true)
          if (-not $statusFunction) { throw 'Updater status function is missing' }
          Invoke-Expression $statusFunction.Extent.Text
          $statusFile = Join-Path $env:RUNNER_TEMP ('kodkon-update-status-test-' + [guid]::NewGuid().ToString('N') + '.json')
          $Version = 'test'
          try {
            Set-Content -LiteralPath $statusFile -Value '{}' -Encoding UTF8
            for ($index = 1; $index -le 81; $index++) {
              Write-UpdateStatus 'installing' 80 "Extracted $index of 81"
            }
            $result = Get-Content -LiteralPath $statusFile -Raw | ConvertFrom-Json
            if ($result.status -ne 'installing' -or $result.version -ne 'test') { throw 'Updater status roundtrip failed' }
          } finally {
            Remove-Item -LiteralPath $statusFile -Force -ErrorAction SilentlyContinue
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed' }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }

      - name: Build multi-resolution Windows icon
        shell: powershell
        run: |
          & .\scripts\create-icon.ps1

      - name: Build web interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package and checksum
        shell: pwsh
        run: |
          $config = Get-Content backend/app/config.py -Raw
          $version = [regex]::Match($config, 'app_version:\s*str\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Could not read app_version from backend/app/config.py' }
          if (($env:GITHUB_REF_NAME).TrimStart('v') -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match app version $version" }
          $package = "release/kodkon-studio-$version-windows-portable.zip"
          python scripts/package.py --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Package creation failed' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.sha256" -Value "$hash  $(Split-Path -Leaf $package)" -Encoding ascii
          Expand-Archive -LiteralPath $package -DestinationPath release/installer-input -Force

      - name: Install Inno Setup compiler
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }

      - name: Build Windows setup installer
        shell: powershell
        run: |
          $config = Get-Content backend/app/config.py -Raw
          $version = [regex]::Match($config, 'app_version:\s*str\s*=\s*"([^"]+)"').Groups[1].Value
          $compilerCandidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $compiler = $compilerCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Could not locate ISCC.exe after installing Inno Setup' }
          & $compiler "-DAppVersion=`"$version`"" "scripts/installer/KodKonStudio.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Setup compilation failed' }
          $installer = "release/kodkon-studio-$version-windows-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Setup EXE was not created' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $(Split-Path -Leaf $installer)" -Encoding ascii

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $config = Get-Content backend/app/config.py -Raw
          $version = [regex]::Match($config, 'app_version:\s*str\s*=\s*"([^"]+)"').Groups[1].Value
          $changelog = Get-Content CHANGELOG.md
          $heading = -1
          for ($i = 0; $i -lt $changelog.Length; $i++) {
            if ($changelog[$i] -match "^##\s+$([regex]::Escape($version))(\s|$)") { $heading = $i; break }
          }
          if ($heading -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $notes = [System.Collections.Generic.List[string]]::new()
          for ($i = $heading; $i -lt $changelog.Length -and ($i -eq $heading -or $changelog[$i] -notmatch '^##\s+'); $i++) { $notes.Add($changelog[$i]) }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $package = "release/kodkon-studio-$version-windows-portable.zip"
          $installer = "release/kodkon-studio-$version-windows-setup.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" $package "$package.sha256" --title "กดก่อนคิดทีหลัง Studio v$version" --notes-file $notesPath
