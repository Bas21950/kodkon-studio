name: Build and publish Windows update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed' }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }

      - name: Build web interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package and checksum
        shell: pwsh
        run: |
          $config = Get-Content backend/app/config.py -Raw
          $version = [regex]::Match($config, 'app_version:\s*str\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Could not read app_version from backend/app/config.py' }
          if (($env:GITHUB_REF_NAME).TrimStart('v') -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match app version $version" }
          $package = "release/kodkon-studio-$version-windows-portable.zip"
          python scripts/package.py --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Package creation failed' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.sha256" -Value "$hash  $(Split-Path -Leaf $package)" -Encoding ascii

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $config = Get-Content backend/app/config.py -Raw
          $version = [regex]::Match($config, 'app_version:\s*str\s*=\s*"([^"]+)"').Groups[1].Value
          $changelog = Get-Content CHANGELOG.md
          $heading = -1
          for ($i = 0; $i -lt $changelog.Length; $i++) {
            if ($changelog[$i] -match "^##\s+$([regex]::Escape($version))(\s|$)") { $heading = $i; break }
          }
          if ($heading -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $notes = [System.Collections.Generic.List[string]]::new()
          for ($i = $heading; $i -lt $changelog.Length -and ($i -eq $heading -or $changelog[$i] -notmatch '^##\s+'); $i++) { $notes.Add($changelog[$i]) }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $package = "release/kodkon-studio-$version-windows-portable.zip"
          gh release create $env:GITHUB_REF_NAME $package "$package.sha256" --title "กดก่อนคิดทีหลัง Studio v$version" --notes-file $notesPath
